# Pure OpenPGP agent — SSH emulation is intentionally NOT enabled.
# On Termux/Android, gpg 2.5 re-protects ssh-added keys through pinentry,
# which needs a TTY the daemon lacks, so ssh-add fails with "agent refused
# operation". SSH keys are handled by the OpenSSH ssh-agent instead (see
# ~/.profile). This file only covers GPG passphrase caching.
default-cache-ttl 28800
max-cache-ttl 28800