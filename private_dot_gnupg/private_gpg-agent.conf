# Enable SSH agent emulation (needed on Termux/Android where systemd
# socket activation is unavailable; on desktop Linux, systemd handles
# this via gpg-agent-ssh.socket).
enable-ssh-support

# Cache passphrase for 8 hours so the vault is unlocked for a work session.
default-cache-ttl 28800
max-cache-ttl 28800

# Keep the decrypted SSH key in the agent for the same 8h window.
# Without these, gpg-agent evicts SSH keys after 30 min (default) and
# re-prompts for the passphrase mid-session.
default-cache-ttl-ssh 28800
max-cache-ttl-ssh 28800
