# CSI-u extended keys, applied best-effort across tmux versions: the options
# moved in and out of tmux over releases (extended-keys predates 3.1,
# extended-keys-format arrives with it; 3.7 accepts both). A `set -g` here is
# a hard parse error on a version lacking the option — and a failed config
# load kills tmux at server start, which in Cloud Shell means "session closed
# before the initial prompt". run-shell swallows per-option failures instead.
run-shell "tmux set -g extended-keys on 2>/dev/null; tmux set -g extended-keys-format csi-u 2>/dev/null"
