# User-level pip config.
#
# Without `user = true`, `pip install` targets the interpreter's own
# site-packages, which is package-manager territory on most of these hosts:
# Termux's $PREFIX is owned by pacman, Linux distro pythons are owned by
# dpkg/rpm, and writing there produces untracked files that break or
# conflict on the next interpreter or package upgrade.
#
# `user = true` routes every install to the per-user site instead:
#   imports -> ~/.local/lib/pythonX.Y/site-packages
#   scripts -> ~/.local/bin  (on PATH via dot_profile)
#
# Inside a virtualenv `--user` is invalid ("User site-packages are not
# visible in this virtualenv"), so venv installs are run as:
#   PIP_USER=0 pip install ...
# `uv pip` ignores pip.conf entirely and is unaffected.
[global]
user = true
