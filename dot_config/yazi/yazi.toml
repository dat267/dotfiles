[manager]
show_hidden = false
show_symlink = true


[preview]
image_quality = 90

[tasks]
micro_workers = 2
macro_workers = 2
barrier_workers = 2

[opener]
edit = [
	{ run = 'nvim "%*"', block = true, for = "windows" },
	{ run = '${EDITOR:-nvim} "$@"', block = true, for = "unix" },
]
open = [
	{ run = 'explorer "%1"', orphan = true, desc = "Open", for = "windows" },
	{ run = 'xdg-open "$@"', orphan = true, desc = "Open", for = "linux" },
	{ run = 'open "$@"', orphan = true, desc = "Open", for = "macos" },
]
extract = [
	{ run = 'dir="${1%.*}"; [ "${dir##*.}" = "tar" ] && dir="${dir%.tar}"; 7z x -o"$dir" -- "$@"', desc = "Extract to subdirectory", for = "unix" },
	{ run = '7z x -o"%~dpn1" "%1"', desc = "Extract to subdirectory", for = "windows" },
]
compress_7z = [
	{ run = '7z a -t7z -mx=9 -mmt=on -ms=on "$1.7z" "$@"', desc = "Compress to 7z", for = "unix" },
	{ run = '7z a -t7z -mx=9 -mmt=on -ms=on "%1.7z" %*', desc = "Compress to 7z", for = "windows" },
]
compress_zip = [
	{ run = '7z a -tzip -mx=9 -mm=Deflate -mmt=on "$1.zip" "$@"', desc = "Compress to Zip", for = "unix" },
	{ run = '7z a -tzip -mx=9 -mm=Deflate -mmt=on "%1.zip" %*', desc = "Compress to Zip", for = "windows" },
]

[open]
rules = [
	{ mime = "text/*", use = "edit" },
	{ mime = "application/{json,ndjson,toml,yaml,xml,javascript,x-sh,x-bash,x-perl,x-python}", use = "edit" },
	{ mime = "image/*", use = "open" },
	{ mime = "{audio,video}/*", use = "open" },
	{ mime = "application/{,g}zip", use = [
		"extract",
		"open",
	] },
	{ mime = "application/x-{tar,bzip*,7z-compressed,xz,rar}", use = [
		"extract",
		"open",
	] },
	{ mime = "*", use = [
		"edit",
		"open",
	] },
]

[plugin]
prepend_previewers = [{ mime = "image/svg+xml", run = "noop" }]
prepend_preloaders = [
	{ mime = "inode/directory", run = "noop" },
	{ mime = "image/svg+xml", run = "noop" },
	{ mime = "image/*", run = "noop" },
	{ mime = "video/*", run = "noop" },
	{ mime = "pdf/*", run = "noop" },
]
