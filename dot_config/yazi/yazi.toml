[opener]
edit = [
  { run = 'nvim "%s"', block = true, for = "windows" },
  { run = '${EDITOR:-nvim} "%s"', block = true, for = "unix" },
]
open = [
  { run = 'explorer "%s"', orphan = true, desc = "Open", for = "windows" },
  { run = 'xdg-open "%s"', orphan = true, desc = "Open", for = "linux" },
  { run = 'open "%s"', orphan = true, desc = "Open", for = "macos" },
]
extract = [
  { run = "sh -c 'f=\"$1\"; d=\"${f%.*}\"; [ \"${d##*.}\" = \"tar\" ] && d=\"${d%.tar}\"; 7z x -y -bso0 -bsp0 -mmt=on -o\"$d\" -- \"$f\"' _ %s", desc = "Extract to...", for = "unix" },
  { run = "powershell -NoProfile -Command \"$f=$args[0]; $p=Split-Path $f -Parent; $n=[System.IO.Path]::GetFileNameWithoutExtension($f); if($n.EndsWith('.tar')){$n=$n.Substring(0,$n.Length-4)}; 7z x -y -bso0 -bsp0 -mmt=on -o(Join-Path $p $n) -- $f\" -- %s", desc = "Extract to...", for = "windows" },
]
compress_7z = [
  { run = '''sh -c '
if [ "$#" -eq 1 ]; then
    name=$(basename "$1")
    if [ -f "$1" ]; then
        name="${name%.*}"
    fi
else
    name=$(basename "$PWD")
fi
7z a -t7z -mx=9 -mmt=on -ms=on "$name.7z" "$@"
' _ %s''', block = true, desc = "Compress to 7z", for = "unix" },
  { run = '''powershell -NoProfile -Command "
if ($args.Count -eq 1) {
    $item = Get-Item -LiteralPath $args[0];
    $name = $item.BaseName;
} else {
    $name = (Get-Item .).Name;
}
7z a -t7z -mx=9 -mmt=on -ms=on \"$name.7z\" $args
" -- %s''', block = true, desc = "Compress to 7z", for = "windows" },
]
compress_zip = [
  { run = '''sh -c '
if [ "$#" -eq 1 ]; then
    name=$(basename "$1")
    if [ -f "$1" ]; then
        name="${name%.*}"
    fi
else
    name=$(basename "$PWD")
fi
7z a -tzip -mx=9 -mm=Deflate -mmt=on "$name.zip" "$@"
' _ %s''', block = true, desc = "Compress to Zip", for = "unix" },
  { run = '''powershell -NoProfile -Command "
if ($args.Count -eq 1) {
    $item = Get-Item -LiteralPath $args[0];
    $name = $item.BaseName;
} else {
    $name = (Get-Item .).Name;
}
7z a -tzip -mx=9 -mm=Deflate -mmt=on \"$name.zip\" $args
" -- %s''', block = true, desc = "Compress to Zip", for = "windows" },
]
concat_media = [
  { run = 'python3 -u ~/.local/scripts/py/ffmpeg-concat.py %s', block = true, desc = "Concat media", for = "unix" },
  { run = 'python -u "%USERPROFILE%\.local\scripts\py\ffmpeg-concat.py" %s', block = true, desc = "Concat media", for = "windows" },
]
transcode_media = [
  { run = 'python3 -u ~/.local/scripts/py/ffmpeg-transcode.py %s', block = true, desc = "Transcode media", for = "unix" },
  { run = 'python -u "%USERPROFILE%\.local\scripts\py\ffmpeg-transcode.py" %s', block = true, desc = "Transcode media", for = "windows" },
]

[open]
rules = [
  { mime = "text/*", use = [ "edit", "compress_7z", "compress_zip" ] },
  { mime = "application/{json,ndjson,toml,yaml,xml,javascript,x-sh,x-bash,x-perl,x-python}", use = [ "edit", "compress_7z", "compress_zip" ] },
  { mime = "image/*", use = [ "open", "compress_7z", "compress_zip" ] },
  { mime = "{audio,video}/*", use = [
    "open",
    "concat_media",
    "transcode_media",
    "compress_7z",
    "compress_zip",
  ] },
  { mime = "application/{,g}zip", use = [
    "extract",
    "open",
    "compress_7z",
    "compress_zip",
  ] },
  { mime = "application/x-{tar,bzip*,7z-compressed,xz,rar}", use = [
    "extract",
    "open",
    "compress_7z",
    "compress_zip",
  ] },
  { mime = "*", use = [
    "edit",
    "open",
    "compress_7z",
    "compress_zip",
  ] },
]
