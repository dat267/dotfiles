[[mgr.prepend_keymap]]
on = ["."]
run = "hidden toggle"
desc = "Toggle hidden files"

[[mgr.prepend_keymap]]
on = ["e"]
run = "shell '${EDITOR:-nvim} %s || { echo \"Editor failed with exit code $?\"; read -p \"Press Enter to continue...\"; }' --block"
desc = "Open with editor"

[[mgr.prepend_keymap]]
on = ["O"]
run = "open --interactive"
desc = "Open interactive"

[[mgr.prepend_keymap]]
on = ["t", "f"]
run = '''
  shell '
    path="%s"
    dir=$(dirname "$path")
    name=$(basename "$path")
    stem="$name"; ext=""
    if [[ "$name" == *.* ]] && [[ "$name" != .* ]]; then
      ext=".${name##*.}"
      stem="${name%.*}"
    fi
    translated=$(python3 ~/.local/scripts/py/executable_translate.py --quiet "$stem" 2>/dev/null)
    if [ -n "$translated" ] && [ "$translated" != "$stem" ]; then
      mv "$path" "$dir/$translated$ext"
    fi
  ' --block
'''
desc = "Translate filename to English"

[[mgr.prepend_keymap]]
on = ["t", "c"]
run = "shell 'python3 ~/.local/scripts/py/executable_translate.py --quiet --file \"%s\"' --block"
desc = "Translate file content to English"
