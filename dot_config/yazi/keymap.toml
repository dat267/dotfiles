[[manager.prepend_keymap]]
on = [ "." ]
run = "hidden"
desc = "Toggle hidden files"

[[manager.prepend_keymap]]
on = [ "E" ]
run = "open --use=extract"
desc = "Extract archive"

[[manager.prepend_keymap]]
on = [ "Z", "7" ]
run = "open --use=compress_7z"
desc = "Compress to 7z"

[[manager.prepend_keymap]]
on = [ "Z", "z" ]
run = "open --use=compress_zip"
desc = "Compress to Zip"
