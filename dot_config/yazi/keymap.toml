[[mgr.prepend_keymap]]
on = ["t", "f"]
run = "shell '$HOME/.local/scripts/py/yazi-translate.py --rename %S 2>&1' --block"
desc = "Translate filename(s) to English"

[[mgr.prepend_keymap]]
on = ["t", "c"]
run = "shell '$HOME/.local/scripts/py/yazi-translate.py --quiet --file %S 2>&1' --block"
desc = "Translate file content(s) to English"

[[mgr.prepend_keymap]]
on = ["z", "e"]
run = "plugin yazi-extract"
desc = "Extract archive"

[[mgr.prepend_keymap]]
on = ["z", "c"]
run = "plugin yazi-compress"
desc = "Compress files (zip/7z)"

[[mgr.prepend_keymap]]
on = ["z", "n"]
run = "plugin yazi-ffmpeg-concat"
desc = "Concat media files"

[[mgr.prepend_keymap]]
on = ["z", "t"]
run = "plugin yazi-ffmpeg-transcode"
desc = "Transcode media file(s)"

[[mgr.prepend_keymap]]
on = ["z", "s"]
run = "plugin yazi-split"
desc = "Split media by timestamps"
