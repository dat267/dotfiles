name: windows

# Windows coverage for the exact_py scripts and the Windows-only dotfiles
# machinery. The dotfiles themselves are exercised on the machines that run
# them; this job exists because the Windows layout cannot be reproduced on
# Linux — npm installs a global package into <prefix>\node_modules with its
# pi.cmd/pi.ps1 shims in the prefix root, several scripts branch on
# Platform.detect(), and the bootstrap/junction scripts and the PowerShell
# profile only exist on Windows.
#
# What this cannot cover: actually running the run_ scripts. The junction
# script rewrites %LOCALAPPDATA%/%APPDATA% junctions, the Documents stub and a
# Start Menu shortcut, and the profile writes HKCU and exports the certificate
# store, so both are rendered and PowerShell-parsed here instead of executed.
#
# The render and parse steps run before pi_lint_extensions on purpose: chezmoi
# walks the source tree, and the extension node_modules symlinks pi_lint_extensions
# creates can be dangling, which makes chezmoi fail with ENOENT while loading.
#
# Everything below the unittest step runs through .github/scripts/step-report.ps1:
# the job log needs repo admin rights, so a failure has to report itself through
# an annotation and the step summary instead.
#
# Note AGENTS.md says automation belongs in chezmoi lifecycle hooks with no CI
# configs. This overrides that for Windows coverage only; .github is listed in
# .chezmoiignore so it is never deployed into $HOME.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "dot_local/scripts/exact_py/**"
      - "dot_pi/**"
      - "dot_config/powershell/**"
      - "run_*.ps1.tmpl"
      - ".github/workflows/windows.yml"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 25
    # Shared egress IP: without a token the GitHub API allows 60 requests/hour
    # and the release lookups fail as "could not determine the latest release".
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # pi's engines field wants >= 22.19.0, and the installer refuses older.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Python script tests
        working-directory: dot_local/scripts/exact_py
        shell: pwsh
        run: |
          $p = Start-Process python -ArgumentList "-m","unittest","discover","-s","exact_tests" `
            -RedirectStandardOutput test-out.txt -RedirectStandardError test-err.txt `
            -NoNewWindow -Wait -PassThru
          Get-Content test-out.txt, test-err.txt
          if ($p.ExitCode -ne 0) {
            Add-Content $env:GITHUB_STEP_SUMMARY "## unittest failures"
            Add-Content $env:GITHUB_STEP_SUMMARY '```'
            Get-Content test-err.txt | Add-Content $env:GITHUB_STEP_SUMMARY
            Add-Content $env:GITHUB_STEP_SUMMARY '```'
            $lines = Get-Content test-err.txt
            for ($i = 0; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match '^(FAIL|ERROR): ') {
                $end = [Math]::Min($i + 6, $lines.Count - 1)
                $detail = ($lines[$i..$end] | Where-Object { $_ -notmatch '^-+$' } |
                  ForEach-Object { $_.Trim() }) -join ' | '
                "::error::$detail"
              }
            }
            exit 1
          }

      # Deploy every template into a throwaway home: run_ scripts are excluded
      # (they would install things and rewrite the runner's profile), but
      # everything else renders for real, including the modify_settings merge.
      # A template that only breaks on Windows fails here.
      - name: Render the dotfiles into a throwaway home
        shell: pwsh
        run: |
          . .github/scripts/step-report.ps1
          Invoke-WithReport "chezmoi-render" {
            $version = "2.72.2"
            $zip = Join-Path $env:RUNNER_TEMP "chezmoi.zip"
            $url = "https://github.com/twpayne/chezmoi/releases/download/v$version/chezmoi_${version}_windows_amd64.zip"
            Invoke-WebRequest -Uri $url -OutFile $zip
            Expand-Archive -Path $zip -DestinationPath (Join-Path $env:RUNNER_TEMP "chezmoi-bin") -Force
            $chezmoi = (Resolve-Path (Join-Path $env:RUNNER_TEMP "chezmoi-bin\chezmoi.exe")).Path
            Invoke-Native "chezmoi --version" { & $chezmoi --version } | Out-Null
            $dest = Join-Path $env:RUNNER_TEMP "home"
            New-Item -ItemType Directory -Force -Path $dest | Out-Null
            Invoke-Native "chezmoi apply" {
              & $chezmoi --source $PWD.Path --destination $dest `
                --config (Join-Path $env:RUNNER_TEMP "chezmoi.toml") --no-tty `
                --exclude=scripts,externals apply --force
            } | Out-Null
            # No CHEZMOI_* prefix: chezmoi reads those as config keys.
            "DOTFILES_CHEZMOI=$chezmoi" | Add-Content $env:GITHUB_ENV
            "RENDERED_HOME=$dest" | Add-Content $env:GITHUB_ENV
          }

      # The deployed profile is the only thing that puts ~/Apps/* on PATH, and
      # the run_ scripts are the bootstrap and the junction setup: none of it is
      # covered by the Python tests.
      - name: Windows-only scripts render and parse
        shell: pwsh
        run: |
          . .github/scripts/step-report.ps1
          Invoke-WithReport "windows-scripts" {
            $dest = $env:RENDERED_HOME
            $profilePath = Join-Path $dest ".config\powershell\Microsoft.PowerShell_profile.ps1"
            if (-not (Test-Path -LiteralPath $profilePath)) { throw "profile was not deployed to $profilePath" }

            $checks = @(
              @{ File = $profilePath; Pattern = 'Apps[\\/]pi'; What = "the pi PATH entry" },
              @{ File = $profilePath; Pattern = 'Apps[\\/]nvim[\\/]bin'; What = "nvim's install dir on PATH" }
            )
            foreach ($c in $checks) {
              if ((Get-Content -Raw $c.File) -notmatch $c.Pattern) {
                throw "$($c.File) does not contain $($c.What) ($($c.Pattern))"
              }
            }

            $files = @($profilePath)
            foreach ($t in @(
                "run_once_before_bootstrap-local-configs.ps1.tmpl",
                "run_onchange_after_create-junctions.ps1.tmpl"
              )) {
              $out = Join-Path $env:RUNNER_TEMP ([IO.Path]::GetFileNameWithoutExtension($t))
              # --file: without it the argument is executed as a literal template.
              Invoke-Native "execute-template $t" {
                & $env:DOTFILES_CHEZMOI execute-template --file $t
              } | Set-Content -Path $out -Encoding utf8
              $files += $out
            }
            # The junction script is the one place that maps LOCALAPPDATA to the
            # XDG config dirs; an empty render would silently deploy nothing.
            $junctions = Get-Content -Raw (Join-Path $env:RUNNER_TEMP "run_onchange_after_create-junctions.ps1")
            if ($junctions -notmatch 'Test-SameTarget' -or $junctions -notmatch 'New-UniqueBackupPath') {
              throw "the junction script rendered without its junction helpers"
            }

            $bad = @()
            foreach ($file in $files) {
              Write-Host "--- $file"
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$null, [ref]$errors) | Out-Null
              if ($errors -and $errors.Count -gt 0) {
                foreach ($e in $errors) { Write-Host "$($e.Extent.StartLineNumber): $($e.Message)" }
                $bad += $file
              }
            }
            if ($bad.Count -gt 0) { throw "PowerShell syntax errors in: $($bad -join ', ')" }
            "parsed $($files.Count) PowerShell files"
          }

      # No --prefix: exercises the Windows default (%USERPROFILE%\Apps\pi), and
      # since the runner's PATH has no profile entry, also the absolute-path
      # shim probe.
      - name: Install pi into the default Windows prefix
        shell: pwsh
        run: |
          . .github/scripts/step-report.ps1
          Invoke-WithReport "install_pi" {
            Invoke-Native "install_pi.py" {
              python dot_local/scripts/exact_py/executable_install_pi.py
            } | Out-Null
          }

      - name: Assert the npm --prefix layout
        shell: pwsh
        run: |
          . .github/scripts/step-report.ps1
          Invoke-WithReport "pi-layout" {
            $prefix = Join-Path $env:USERPROFILE "Apps\pi"
            $expected = @(
              (Join-Path $prefix "pi.cmd"),
              (Join-Path $prefix "node_modules\@earendil-works\pi-coding-agent\package.json")
            )
            foreach ($p in $expected) {
              if (-not (Test-Path -LiteralPath $p)) { throw "missing after install: $p" }
            }
            Get-ChildItem -LiteralPath $prefix -Name
            Invoke-Native "pi.cmd --version" { & (Join-Path $prefix "pi.cmd") --version } | Out-Null
          }

      - name: Installer reports up to date
        shell: pwsh
        run: |
          . .github/scripts/step-report.ps1
          Invoke-WithReport "install_pi-check" {
            Invoke-Native "install_pi.py --check" {
              python dot_local/scripts/exact_py/executable_install_pi.py --check
            } | Out-Null
          }

      # Resolves %USERPROFILE%\Apps\pi\node_modules, symlinks each extension's
      # deps and runs npx.cmd — a bare "npx" is a shell script Windows cannot
      # launch.
      - name: pi_lint_extensions
        shell: pwsh
        run: |
          . .github/scripts/step-report.ps1
          Invoke-WithReport "pi_lint" {
            Invoke-Native "pi_lint_extensions.py" {
              python dot_local/scripts/exact_py/executable_pi_lint_extensions.py
            } | Out-Null
          }

      # The one real install into ~/Apps: exercises the Windows asset, the zip
      # extraction, the install dir layout and the binary's own --version check
      # outside Linux.
      - name: Install nvim into the Windows prefix
        shell: pwsh
        run: |
          . .github/scripts/step-report.ps1
          Invoke-WithReport "install_nvim" {
            Invoke-Native "install_nvim.py" {
              python dot_local/scripts/exact_py/executable_install_nvim.py
            } | Out-Null
          }

      - name: nvim is reachable from the deployed profile
        shell: pwsh
        run: |
          . .github/scripts/step-report.ps1
          Invoke-WithReport "nvim-profile" {
            $exe = Join-Path $env:USERPROFILE "Apps\nvim\bin\nvim.exe"
            if (-not (Test-Path -LiteralPath $exe)) { throw "missing after install: $exe" }
            Invoke-Native "nvim.exe --version" { & $exe --version } | Select-Object -First 1
            # install_nvim.py's dir and the profile's PATH entry have to agree:
            # they were Apps\nvim-win64 vs Apps\nvim, which installs nvim into a
            # directory nothing looks in.
            $profilePath = Join-Path $env:RENDERED_HOME ".config\powershell\Microsoft.PowerShell_profile.ps1"
            $rel = $exe.Substring($env:USERPROFILE.Length).TrimStart('\').Replace('\', '/')
            if ((Get-Content -Raw $profilePath).Replace('\', '/') -notmatch [regex]::Escape($rel)) {
              throw "the profile does not put $rel on PATH"
            }
          }
