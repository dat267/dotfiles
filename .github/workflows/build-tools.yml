name: Build and Release Tools

on:
  push:
    branches:
      - main
    paths:
      - "dot_local/src/**"
      - ".github/workflows/build-tools.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      tools: ${{ steps.find.outputs.tools }}
    steps:
      - uses: actions/checkout@v4

      - name: Discover tools (dirs containing a Makefile)
        id: find
        run: |
          tools=$(
            find dot_local/src -maxdepth 2 -name "Makefile" \
              | xargs -I{} dirname {} \
              | xargs -I{} basename {} \
              | sort \
              | jq -R . | jq -sc .
          )
          echo "Discovered tools: $tools"
          echo "tools=$tools" >> "$GITHUB_OUTPUT"

  build:
    needs: discover
    name: Build ${{ matrix.tool }} ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tool: ${{ fromJson(needs.discover.outputs.tools) }}
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Build via Makefile
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: "max/${{ github.sha }}"
        run: |
          SUFFIX=""
          [ "${{ matrix.goos }}" = "windows" ] && SUFFIX=".exe"
          OUT="$GITHUB_WORKSPACE/${{ matrix.tool }}-${{ matrix.goos }}-${{ matrix.goarch }}${SUFFIX}"
          make -C "dot_local/src/${{ matrix.tool }}" build OUT="$OUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.tool }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ matrix.tool }}-${{ matrix.goos }}-${{ matrix.goarch }}*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Generate short SHA tag
        id: meta
        run: |
          echo "tag=max/$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "Release ${{ steps.meta.outputs.tag }}"
          target_commitish: ${{ github.sha }}
          files: "*"

      - name: Clean up old tools releases and tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          echo "Fetching max releases..."
          releases=$(gh release list --limit 100 --json tagName | jq -r '.[].tagName' | grep '^max/')
          
          count=0
          for tag in $releases; do
            count=$((count + 1))
            if [ $count -gt 3 ]; then
              echo "Deleting old release and tag: $tag"
              gh release delete "$tag" --yes --cleanup-tag || true
            else
              echo "Keeping release: $tag"
            fi
          done